name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run --python ${{ matrix.python-version }} ruff check

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} python -m unittest tests/test_*.py
